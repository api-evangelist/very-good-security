aid: very-good-security
name: Very Good Security
description: >-
  Very Good Security (VGS) is a data security and payments infrastructure company
  that lets organizations operate on sensitive data — payment card numbers, bank
  accounts, PII, and other regulated information — without the cost or liability of
  storing it themselves. Its core Vault tokenization platform substitutes sensitive
  values with format-preserving aliases so customer systems never touch raw data,
  dramatically reducing PCI DSS, SOC 2, HIPAA, and GDPR compliance scope. VGS also
  offers Zero Data (a proxy that keeps the customer environment entirely out of PCI
  scope), a Card Management Platform (network tokens, account updater, 3D Secure),
  and VGS Control for compliance automation. The developer surface includes the Vault
  HTTP API for aliases/tokenization, VGS Collect and VGS Show client SDKs, a Terraform
  provider, and the vgs-cli command line tool. Founded in 2015, VGS is backed by a16z
  and stores over 5 billion tokens.
